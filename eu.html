    const linkTypes = {
      facebook: { label: 'Facebook', cls: 'bg-[#1877F2]/10 text-[#1877F2] hover:bg-[#1877F2]/20' },
      x:        { label: 'X',        cls: 'bg-gray-900/5 text-gray-800 hover:bg-gray-900/10' },
      chat:     { label: 'Chat',     cls: 'bg-[#5865F2]/10 text-[#5865F2] hover:bg-[#5865F2]/20' },
      stats:    { label: 'Stats',    cls: 'bg-emerald-500/10 text-emerald-700 hover:bg-emerald-500/20' },
      wiki:     { label: 'Wiki',     cls: 'bg-waze-cyan/15 text-waze-blue hover:bg-waze-cyan/25' },
      forum:    { label: 'Forum',    cls: 'bg-orange-500/10 text-orange-600 hover:bg-orange-500/20' },
      youtube:  { label: 'YouTube',  cls: 'bg-red-500/10 text-red-600 hover:bg-red-500/20' },
    };

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function card(c) {
      const external = c.web && /^https?:/.test(c.web);
      const target = external ? ' target="_blank" rel="noopener"' : '';
      const title = c.web
        ? `<a href="${esc(c.web)}"${target} class="font-bold text-waze-navy hover:text-waze-cyan transition-colors">${esc(c.name)}</a>`
        : `<span class="font-bold text-waze-navy">${esc(c.name)}</span>`;
      const webPill = c.web
        ? `<a href="${esc(c.web)}"${target} class="text-xs font-semibold px-3 py-1.5 rounded-full bg-waze-navy text-white hover:bg-waze-blue transition-colors">Website</a>`
        : '';
      const pills = c.links.map(([type, url]) => {
        const t = linkTypes[type];
        return `<a href="${esc(url)}" target="_blank" rel="noopener" class="text-xs font-semibold px-3 py-1.5 rounded-full transition-colors ${t.cls}">${t.label}</a>`;
      }).join('');
      const body = (webPill || pills)
        ? `<div class="flex flex-wrap gap-2">${webPill}${pills}</div>`
        : `<div class="text-xs text-gray-300 italic">No community links yet</div>`;
      const dim = (c.web || c.links.length) ? '' : ' opacity-60';
      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col gap-4${dim}" data-search="${esc((c.name + ' ' + (c.local || '')).toLowerCase())}">
          <div class="flex items-center gap-3">
            <img src="https://flagcdn.com/w80/${c.flag}.png" alt="" width="40" height="30" loading="lazy"
                 class="w-10 h-[30px] object-cover rounded shadow-sm border border-gray-100 flex-shrink-0" />
            <div class="min-w-0">
              <div class="leading-tight">${title}</div>
              ${c.local ? `<div class="text-gray-400 text-xs italic truncate">${esc(c.local)}</div>` : ''}
            </div>
          </div>
          ${body}
        </div>`;
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = countries.map(card).join('');

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      let visible = 0;
      grid.querySelectorAll('[data-search]').forEach(el => {
        const show = !q || el.dataset.search.includes(q);
        el.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      document.getElementById('empty').classList.toggle('hidden', visible > 0);
    });
  </script>
